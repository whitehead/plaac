[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plaac"
version = "0.1.0"
description = "Python API for PLAAC (Prion-Like Amino Acid Composition)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed for PlaacRun.to_dataframe(); the rest of the API is stdlib-only.
pandas = ["pandas"]

[project.urls]
Homepage = "https://github.com/whitehead/plaac"

[tool.setuptools]
py-modules = ["plaac"]
