name: PLAAC docker web container build

on:
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [plaac-release]
    
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/plaac-web

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # - name: Check out repository
      #   uses: actions/checkout@v7
      #   with:
      #     fetch-depth: 0
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repository || github.repository }}
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref }}
          fetch-depth: 0          

      - name: Determine Git revision
        id: git
        run: |
          echo "Repository: $(git remote get-url origin)"
          echo "Revision: $(git rev-parse HEAD)"
          echo "Tags: $(git tag --points-at HEAD | tr '\n' ' ')"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"          
          
      - name: Determine PLAAC version
        id: version
        run: |
          VERSION=$(./cli/get_plaac_version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PLAAC Version: $VERSION"
          
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLAAC_VERSION=${{ steps.version.outputs.version }}
            PLAAC_GIT_SHA=${{ steps.git.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
