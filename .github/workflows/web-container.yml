name: PLAAC docker web container build

on:
  workflow_dispatch:
  push:
    paths-ignore: &plaac_web_paths
      - '.gitignore'
      - '.github/dependabot.yml'
      - '.github/workflows/cli.yml'
      - '.github/workflows/web-integration-test.yml'      
      - '**/*.md'
      - 'cli/build_background_files.py'
      - 'cli/example/generate_example_output.sh'
      - 'cli/example/generate_scer_spreadsheet.sh'
      - 'cli/example/visualize_example_output.sh'
      - 'web/bin/fancy-yeast-spreadsheet.py'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/plaac-web

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Debug Git version
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.ref_type=${{ github.ref_type }}"
          echo "github.sha=${{ github.sha }}"
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Tags pointing at HEAD:"
          git tag --points-at HEAD
          echo "All tags:"
          git tag --list --sort=-version:refname | head -20
          echo "git describe:"
          git describe --tags --always --dirty          
          
      - name: Determine PLAAC version
        id: version
        run: |
          VERSION=$(./cli/get_plaac_version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "PLAAC Version: $VERSION"
          
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            #type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLAAC_VERSION=${{ steps.version.outputs.version }}
            PLAAC_GIT_SHA=${{ github.sha }}            
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
