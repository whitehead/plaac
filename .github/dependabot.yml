version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"

  - package-ecosystem: "bundler"
    directory: "/web"
    schedule:
      interval: "weekly"
    target-branch: "master"
    groups:
      bundler:
        patterns:
          - "*"
